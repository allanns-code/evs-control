services:
  - type: web
    name: evs-control
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DB_PATH
        value: /var/data/data.sqlite
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: evs-data
      mountPath: /var/data
      sizeGB: 1
